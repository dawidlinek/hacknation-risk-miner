<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Historia zmian</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
a{color:#0A0A0A}a:hover{color:#404040}
a:focus-visible,button:focus-visible,summary:focus-visible,input:focus-visible{outline:2px solid #0A0A0A;outline-offset:2px}
</style>
</helmet>
<div style="min-height:100vh;background:#FFFFFF;font-family:'Geist',system-ui,sans-serif;color:#0A0A0A">
<header style="border-bottom:1px solid #F0F0F0">
<div style="max-width:1240px;margin:0 auto;padding:14px 24px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 20px">
<a href="Main.dc.html" style="display:inline-flex;align-items:baseline;text-decoration:none;color:#0A0A0A;font-size:19px;font-weight:700;letter-spacing:-.04em">{{brandA}}<span style="margin-left:3px;padding:0 6px 2px;border-radius:8px;background:#0A0A0A;color:#FFFFFF;letter-spacing:-.02em">{{brandB}}</span></a>
<nav aria-label="Moduły" style="display:flex;gap:4px;flex-wrap:wrap;align-items:center">
<sc-for list="{{nav}}" as="n" hint-placeholder-count="6"><a href="{{n.href}}" style="{{n.style}}">{{n.label}}<sc-if value="{{n.count}}" hint-placeholder-val="{{false}}"><span style="margin-left:6px;font:600 11px 'Geist Mono',monospace;padding:1px 6px;border-radius:999px;background:#F0F0F0;color:#404040">{{n.count}}</span></sc-if></a></sc-for>
<details style="position:relative"><summary style="list-style:none;min-height:36px;display:inline-flex;align-items:center;padding:0 12px;border-radius:999px;font:500 14px 'Geist',sans-serif;cursor:pointer;background:#0A0A0A;color:#FFFFFF">Historia</summary><div style="position:absolute;right:0;top:42px;z-index:5;background:#FFFFFF;border:1px solid #E5E5E5;border-radius:18px;padding:6px;min-width:200px;box-shadow:0 12px 32px rgba(10,10,10,.14);display:flex;flex-direction:column"><sc-for list="{{more}}" as="m" hint-placeholder-count="4"><a href="{{m.href}}" style="padding:10px 12px;border-radius:12px;text-decoration:none;font:500 14px 'Geist',sans-serif;color:#0A0A0A">{{m.label}}</a></sc-for></div></details>
</nav>
<div style="display:flex;align-items:center;gap:10px"><span style="display:inline-flex;align-items:center;gap:6px;font-size:13px;color:#166534"><span style="width:7px;height:7px;border-radius:999px;background:#16A34A"></span>tryb suwerenny</span><button type="button" aria-label="Konto: ekspert" style="width:40px;height:40px;border-radius:999px;border:1px solid #E5E5E5;background:#F5F5F5;font:600 14px 'Geist',sans-serif">E</button></div>
</div>
</header>
<div style="max-width:1240px;margin:0 auto;padding:36px 24px 72px;display:flex;flex-direction:column;gap:20px">
<div style="display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between;align-items:flex-end">
<div style="display:flex;flex-direction:column;gap:8px"><span style="font:500 13px 'Geist Mono',monospace;color:#6B6B6B">dziennik tylko do dopisywania, nic nie znika</span><h1 style="margin:0;font-size:36px;font-weight:600;letter-spacing:-.035em;line-height:1.1">Historia zmian</h1></div>
<button type="button" style="min-height:42px;padding:0 16px;border-radius:999px;border:1px solid #E5E5E5;background:#FFFFFF;font:500 14px 'Geist',sans-serif">Eksportuj CSV</button>
</div>
<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
<sc-for list="{{filters}}" as="f" hint-placeholder-count="5"><button type="button" aria-pressed="{{f.on}}" style="{{f.s}}">{{f.l}}</button></sc-for>
<label style="display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid #E5E5E5;margin-left:auto"><span style="font-size:13px;color:#6B6B6B">dzień</span><input type="date" value="2026-11-21" style="border:0;outline:none;font:500 14px 'Geist',sans-serif"></label>
</div>
<div style="display:flex;flex-direction:column;gap:8px">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="7">
<div style="display:grid;grid-template-columns:64px 38px minmax(0,1fr) auto;gap:14px;align-items:start;padding:14px 16px;border-radius:18px;border:1px solid #F0F0F0">
<span style="font:500 13px 'Geist Mono',monospace;color:#6B6B6B;padding-top:9px">{{r.time}}</span>
<span style="{{r.av}}">{{r.who1}}</span>
<span style="display:flex;flex-direction:column;gap:6px;min-width:0"><span style="font-size:15px"><strong style="font-weight:600">{{r.who}}</strong> {{r.what}} <a href="{{r.href}}" style="font-weight:500">{{r.obj}}</a></span><span style="display:flex;gap:6px;flex-wrap:wrap;align-items:center"><span style="font:500 12px 'Geist Mono',monospace;padding:3px 8px;border-radius:8px;background:#F6F6F6;color:#525252;text-decoration:line-through">{{r.before}}</span><span aria-hidden="true" style="color:#A3A3A3">→</span><span style="font:500 12px 'Geist Mono',monospace;padding:3px 8px;border-radius:8px;background:#F6F6F6;color:#0A0A0A">{{r.after}}</span><sc-if value="{{r.note}}" hint-placeholder-val="{{false}}"><span style="font-size:13px;color:#525252">{{r.note}}</span></sc-if></span></span>
<span style="font:500 12px 'Geist Mono',monospace;color:#6B6B6B;padding-top:9px;white-space:nowrap">{{r.id}}</span>
</div>
</sc-for>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"brandA":{"editor":"text","default":"risk"},"brandB":{"editor":"text","default":"miner"},"$preview":{"width":1440,"height":1100}}'>
class Component extends DCLogic {
  renderVals() {
    const active = '';
    const NAV = [['Pulpit','Main.dc.html',''],['Projekty','B2-Projekty.dc.html',''],['Nowa inwestycja','A1-Start.dc.html',''],['Przegląd','C1-Przeglad.dc.html','37'],['Monitoring','D2-Monitoring.dc.html','12'],['Katalog','C2-Katalog.dc.html','']];
    const nav = NAV.map(([label, href, count]) => ({ label, href, count, style: "min-height:36px;display:inline-flex;align-items:center;padding:0 12px;border-radius:999px;text-decoration:none;font:500 14px 'Geist',sans-serif;" + (label === active ? 'background:#0A0A0A;color:#FFFFFF' : 'color:#404040') }));
    const more = [['Import i źródła','B1-Import.dc.html'],['Historia','D3-Historia.dc.html'],['Ustawienia','D4-Ustawienia.dc.html']].map(([label, href]) => ({ label, href }));
    const fb = "min-height:40px;padding:0 14px;border-radius:999px;font:500 14px 'Geist',sans-serif;";
    const filters = [['Wszystko', true], ['Decyzje eksperta', false], ['Import i wzbogacanie', false], ['Katalog', false], ['Model', false]].map(([l, on]) => ({ l, on: String(on), s: fb + (on ? 'border:0;background:#0A0A0A;color:#FFFFFF' : 'border:1px solid #E5E5E5;background:#FFFFFF;color:#404040') }));
    const AV = { e: ['E', 'width:38px;height:38px;border-radius:999px;background:#0A0A0A;color:#FFFFFF;display:inline-flex;align-items:center;justify-content:center;font:600 14px Geist,sans-serif'], s: ['S', 'width:38px;height:38px;border-radius:12px;background:#525252;color:#FFFFFF;display:inline-flex;align-items:center;justify-content:center;font:600 14px Geist,sans-serif'], m: ['AI', 'width:38px;height:38px;border-radius:12px;background:#7C3AED;color:#FFFFFF;display:inline-flex;align-items:center;justify-content:center;font:600 12px Geist,sans-serif'] };
    const r = (time, k, who, what, obj, href, before, after, note, id) => ({ time, who1: AV[k][0], av: AV[k][1], who, what, obj, href, before, after, note, id });
    const rows = [
      r('13:20', 'e', 'Ekspert', 'zmienił wagę podobieństwa w', 'Katalogu wiedzy', 'C2-Katalog.dc.html', 'zakres i ilości: 18', 'zakres i ilości: 22', 'katalog v1.2 → v1.3', 'kat-v1.3'),
      r('13:12', 'e', 'Ekspert', 'zatwierdził zdarzenie', 'R02, Steklin', 'C1-Przeglad.dc.html', 'do przeglądu', 'zatwierdzone', '', 'evt-1187'),
      r('13:12', 'e', 'Ekspert', 'oznaczył jako przykład wzorcowy', 'R02, Steklin', 'C1-Przeglad.dc.html', 'zwykły', 'wzorcowy', '7 podobnych propozycji przeliczono', 'gold-12'),
      r('12:58', 'e', 'Ekspert', 'poprawił powiązanie', 'Biecz, RM-2026-008', 'B2-Projekty.dc.html', 'część 1', 'części 1–4', 'powód: opis KPO obejmuje 11,871 km = 4 części', 'link-022'),
      r('12:41', 'm', 'Model Bielik 11B (PL)', 'zaproponował zdarzenie', 'R04, Steklin', 'C1-Przeglad.dc.html', 'brak', 'R04, pewność 0,32', 'źródło: ogłoszenie o wykonaniu, sekcja zmian', 'evt-1190'),
      r('12:41', 's', 'System', 'wzbogacił', 'uruchomienie #43', 'B1-Import.dc.html', '0 ogłoszeń', '4 ogłoszenia', 'BZP API (mirror), 2,1 s', 'run-43'),
      r('12:05', 's', 'System', 'zaimportował', 'zestaw organizatora (XLSX)', 'B1-Import.dc.html', 'brak', '22 przedsięwzięcia', '4 rozbieżności do przeglądu', 'run-40')
    ];
    return { brandA: this.props.brandA ?? 'risk', brandB: this.props.brandB ?? 'miner', nav, more, filters, rows };
  }
}
</script>
</body>
</html>
