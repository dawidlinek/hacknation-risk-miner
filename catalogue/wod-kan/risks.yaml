    z kosztorysu ofertowego. Termin wykonania ulega przedłużeniu o czas niezbędny do ich wykonania, potwierdzony przez inspektora nadzoru.
  - Odwodnienie wykopów rozlicza się obmiarowo według ceny jednostkowej za dobę pracy zestawu odwadniającego na 1 m wykopu, do kwoty rezerwy [Y]
    zł.
