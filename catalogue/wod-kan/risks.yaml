        p90: 0.17
      source: BZP_2022_2026
    macro: 'GUS: ceny budowy obiektów inżynierii lądowej i wodnej r/r: XI 2022 +14,8%, I 2023 +13,2%, XII 2023 +8,8%.'
  mitigations:
