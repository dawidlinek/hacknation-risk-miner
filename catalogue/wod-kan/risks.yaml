        p75: 0.065
        p90: 0.197
      source: BZP_2022_2026
    literature: 'Interpelacja 16654 (2026): gminy wskazują trudne warunki geologiczne i hydrologiczne jako przyczynę opóźnień KPO B3.1.1.'
