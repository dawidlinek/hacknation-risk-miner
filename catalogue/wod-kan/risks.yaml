# Sector pack wod-kan: edit in the panel or here; loaded by `riskminer seed-catalogue`.
# Source: docs/research/03_domain_methodology.md (+ expert materials). status: approved | proposed.
schema_version: 1
sector: wod-kan
effect_units:
  delay_days: dni (rzeczywisty − planowany koniec)
  cost_pct: wypłata/umowa − 1 (brutto/brutto)
  budget_pct: cena wybrana/(wartość zamówienia × (1+VAT)) − 1
default_sources:
  BZP_2022_2026: 'Analiza własna: ogłoszenia o wykonaniu umowy BZP 2022–2026, wod-kan, n=7105 (kopia bzp.cytr.us, 2026-11-21)'
  BZP_CHG_2022_2026: 'Analiza własna: ogłoszenia o zmianie umowy BZP 2022–2026, wod-kan, n=1163'
  BZP_RES_2022_2026: 'Analiza własna: ogłoszenia o wyniku BZP 2022–2026, wod-kan, n=9414 części'
risks:
- id: R01
  name: Niepełny lub niespójny zakres
  status: approved
  effects_text: Błędna wycena, pominięcie lub dublowanie robót, zmiana zakresu, roboty dodatkowe, roszczenie albo spór o wynagrodzenie.
  children:
  - R01.1
  - R01.2
  - R01.3
  - R01.4
- id: R01.1
  parent: R01
  name: Rozbieżności między projektem, przedmiarem, STWiORB i PFU
  status: proposed
  phases:
  - przygotowanie
  - postepowanie
  - realizacja
  formula:
  - buduj
  - zaprojektuj_i_wybuduj
  signals:
  - doc_types:
    - QA
    patterns:
    - przedmiar\w* nie (zawiera|uwzględnia|obejmuje)
    - brak (pozycji|w przedmiarze)
    - rozbieżnoś\w* (między|pomiędzy)
    - niezgodnoś\w* (projektu|przedmiaru|dokumentacji)
    strength: 0.45
  - doc_types:
    - SWZ_MOD
    patterns:
    - zmian\w* (przedmiaru|dokumentacji projektowej|STWiORB)
    - zamieszcza zmieniony przedmiar
    strength: 0.4
  - doc_types:
    - meta
    rule: liczba pytań w Q&A / wartość zamówienia [mln zł] > P75 grupy referencyjnej
    strength: 0.3
  - doc_types:
    - meta
    rule: termin składania ofert przesunięty ≥ 2 razy (ogłoszenia o zmianie ogłoszenia)
    strength: 0.3
  events:
  - EV_ADDITIONAL_WORKS
  - EV_PRICE_INCREASE
  - EV_TERM_EXTENSION
  notice_evidence:
    legal_basis:
    - 455 ust. 1 pkt 3
    - 455 ust. 2
    - 455 ust. 1 pkt 1
    reason_patterns:
    - nieujęt\w* w (przedmiarze|dokumentacji)
    - błęd\w* (projekt|w dokumentacji)
    - roboty (dodatkowe|zamienne)
  effects:
    empirical:
      category: projekt/dokumentacja
      n: 642
      p_late: 0.67
      delay_days:
        p50: 46
        p75: 128
      cost_pct:
        p50: 0.005
        p75: 0.057
        p90: 0.134
      source: BZP_2022_2026
    literature: 'Rybka & Bondar-Nowakowska 2013: projekt zamawiającego (Red Book), 92 zmiany dokumentacji, koszt 14,42% kwoty kontraktu; ZiW
      (Yellow Book), 1 zmiana, 7,01%.'
  causes:
  - pośpiech w przygotowaniu dokumentacji
  - nieaktualne mapy do celów projektowych
  - długi czas między projektem a przetargiem
  - brak weryfikacji przedmiaru
  mitigations:
  - niezależna weryfikacja dokumentacji i przedmiaru przed ogłoszeniem
  - aktualizacja projektu starszego niż 2 lata
  - hierarchia dokumentów w umowie
  - ceny jednostkowe do rozliczania robót dodatkowych
  clauses:
  - 'W przypadku rozbieżności pomiędzy dokumentami obowiązuje następująca kolejność ważności: 1) umowa, 2) SWZ wraz z wyjaśnieniami i zmianami,
    3) dokumentacja projektowa, 4) STWiORB, 5) przedmiar robót (charakter pomocniczy).'
  - Roboty nieujęte w dokumentacji, niezbędne do prawidłowego wykonania przedmiotu umowy, wykonawca wykona po sporządzeniu protokołu konieczności;
    ich wartość ustala się według cen jednostkowych z kosztorysu ofertowego, a w razie ich braku, według średnich stawek i cen SEKOCENBUD z kwartału
    poprzedzającego wykonanie robót (R, S, Kp, Z).
  checklist_refs:
  - 04:3.5.1
- id: R01.2
  parent: R01
  name: Zakres orientacyjny w PFU (formuła zaprojektuj i wybuduj)
  status: proposed
  formula:
  - zaprojektuj_i_wybuduj
  signals:
  - doc_types:
    - PFU
    - OPZ
    - NOTICE_DESC
    patterns:
    - wartości (są )?orientacyjne
    - nie mogą zostać zagwarantowane
    - ok\.\s?\d
    - około \d+ ?(m|mb|km|szt)
    - brak (analizy terenu|badań gruntu)
    strength: 0.55
  - doc_types:
    - PPU
    patterns:
    - wynagrodzenie ryczałtowe
    combine_with: wartości orientacyjne
    strength: 0.6
    note: ryczałt + ilości orientacyjne = przeniesienie niepoliczalnego ryzyka na wykonawcę → premia w cenie lub spór
  events:
  - EV_ADDITIONAL_WORKS
  - EV_PRICE_INCREASE
  - EV_TERM_EXTENSION
  - EV_SCOPE_REDUCTION
  effects:
    empirical:
      note: 'ZiW vs buduj (BZP_2022_2026): P(5.3=Nie) 50% vs 29%; opóźnienie P80 129 vs 39 dni; P(≥1 zmiana) 62% vs 41%; koszt P90 +7,5% vs +7,3%'
  causes:
  - PFU przygotowany bez wizji terenu i badań
  - zakres liczony z mapy
  mitigations:
  - koncepcja i badania geotechniczne przed PFU
  - ilości graniczne (min–max) z ceną jednostkową za nadwyżkę
  - etapowanie z punktem decyzyjnym po koncepcji
  clauses:
  - Wynagrodzenie ryczałtowe obejmuje wykonanie sieci o łącznej długości do [L_max] m; za długość przekraczającą [L_max] wynagrodzenie ustala
    się jako iloczyn nadwyżki i ceny jednostkowej za 1 m określonej w formularzu ofertowym. W przypadku długości mniejszej niż [L_min] wynagrodzenie
    ulega obniżeniu według tej samej ceny jednostkowej.
  - Po zatwierdzeniu koncepcji przez zamawiającego strony w terminie 14 dni potwierdzają zakres rzeczowy; zmiana zakresu wynikająca z koncepcji
    stanowi zmianę przewidzianą w art. 455 ust. 1 pkt 1 Pzp.
