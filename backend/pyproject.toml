[project]
name = "riskminer"
version = "0.1.0"
description = "Risk Miner: source-backed case base and risk analytics for public water/sewage investments (HackNation 2026, MFiPR)"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "httpx>=0.27",
  "tenacity>=9.0",
  "pyyaml>=6.0",
  "openpyxl>=3.1",
  "pgvector>=0.3.6",
  "rapidfuzz>=3.10",
  "selectolax>=0.3.21",
  "orjson>=3.10",
  "pypdfium2>=5.15.2",
  "python-dateutil>=4.0.0",
]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.7"]

[project.scripts]
riskminer = "riskminer.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["riskminer"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
