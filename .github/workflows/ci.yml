# CI for ex ante: lint, typecheck, unit/component tests and licence gates.
# e2e (Playwright) needs the live database and stays local: `cd frontend && npx playwright test --project=live`.
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Route tree
        run: npx tsr generate
      - name: Typecheck
        run: npx tsc -b --noEmit
      - name: Lint (Biome)
        run: npx biome check src e2e
      - name: Copy rules (no U+2014, no U+00B7)
        run: node scripts/check-copy.mjs
      - name: Vitest (unit + component, MSW node)
        run: npx vitest run
      - name: Build
        run: npx vite build
      - name: Licences (production deps, permissive only)
        run: >-
          npx license-checker-rseidelsohn --production --excludePrivatePackages --onlyAllow
          "MIT;ISC;BSD-2-Clause;BSD-3-Clause;Apache-2.0;0BSD;CC0-1.0;OFL-1.1;BlueOak-1.0.0;Unlicense;MIT OR Apache-2.0;(MIT OR Apache-2.0);MIT OR CC0-1.0;MIT AND ISC AND BSD-3-Clause;(MIT AND ISC AND BSD-3-Clause)"

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # No database in CI: only tests marked `unit` run (DB, network and model tests stay local).
      DATABASE_URL: postgresql+asyncpg://ci:ci@127.0.0.1:1/none
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen
      - name: Ruff (syntax errors and undefined names)
        run: uv run --no-sync ruff check --select E9,F63,F7,F82 .
      - name: Pytest (non-mutating, no database)
        run: uv run --no-sync pytest -q -m unit -p no:cacheprovider
      - name: Banned dependencies (CLAUDE.md invariant 5)
        run: |
          banned='pymupdf|fitz|ocrmypdf|ghostscript|marker-pdf|surya-ocr|mineru|magic-pdf|litellm|psycopg|psycopg2|psycopg-binary|psycopg2-binary'
          if grep -iE "^name = \"(${banned})\"$" uv.lock; then
            echo "::error::banned dependency in backend/uv.lock (see CLAUDE.md invariant 5)"; exit 1
          fi
          if grep -iE '"node_modules/(pymupdf|ghostscript|litellm)[^"]*"' ../frontend/package-lock.json; then
            echo "::error::banned dependency in frontend/package-lock.json"; exit 1
          fi
      - name: Licences (declared copyleft or non-commercial fails)
        run: uvx pip-licenses@5 --python .venv/bin/python --from=mixed --fail-on "GPL;Commons Clause;Non-Commercial" --partial-match
