# CI (verification.md §3). Big data never enters CI: no national DB, no data/, no materials/.
# backend: tests marked `unit` (no database) + syntax/undefined-name lint. frontend: typecheck, lint, unit tests, build.
# End-to-end (frontend/e2e, Playwright) needs the full stack and runs locally / against the rehearsal URL:
#   E2E_BASE_URL=https://… npx playwright test --project=live
name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+asyncpg://ci:ci@127.0.0.1:1/none   # unit tests must not touch a database
      RISKMINER_LLM_FAKE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - name: Lint (syntax errors, undefined names)
        run: uv run --no-sync ruff check riskminer tests --select E9,F63,F7,F82
      - name: Unit tests (no database)
        run: uv run --no-sync pytest -q -p no:cacheprovider -m "unit and not mutates and not live and not live_llm"
      - name: OpenAPI contract export
        run: uv run --no-sync python ../scripts/export_openapi.py /tmp/openapi.json

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint (biome)
        run: npm run lint
      - name: Unit tests (vitest)
        run: npx vitest run
      - name: Build
        run: npm run build
